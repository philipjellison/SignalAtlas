<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geochron WebGL2 Prototype</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="display prototype-display">
  <main class="prototype-frame">
    <canvas id="prototype-map" aria-label="Solar-fixed WebGL2 world map"></canvas>
    <div class="prototype-timezone-labels" id="prototype-timezone-labels" aria-hidden="true"></div>
    <output class="prototype-shack-label" id="prototype-shack-label"></output>
    <div class="info-bar info-top"><strong>WebGL2 solar-fixed prototype</strong><time id="prototype-time">Loading…</time></div>
    <output class="prototype-metrics" id="prototype-metrics">Initializing WebGL2…</output>
  </main>
  <script type="module" src="/assets/webgl-prototype.js"></script>
</body>
</html>
