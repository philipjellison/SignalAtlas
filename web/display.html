<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignalAtlas Display</title><link rel="stylesheet" href="/assets/style.css"></head>
<body class="display webgl-display">
  <main class="display-frame">
    <canvas id="display-map" aria-label="Solar-fixed WebGL2 world map"></canvas>
    <div class="display-timezone-labels" id="display-timezone-labels" aria-hidden="true"></div>
    <output class="display-shack-label" id="display-shack-label"></output>
    <div class="info-bar info-top"><span aria-hidden="true"></span><strong id="display-station-name"></strong><time id="display-time">Loading…</time></div>
    <output class="display-metrics" id="display-metrics">Initializing WebGL2…</output>
  </main>
  <script type="module" src="/assets/display.js"></script>
</body>
</html>
